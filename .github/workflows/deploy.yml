name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure base path
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          # Check if a custom domain CNAME file exists
          if [[ -f "public/CNAME" ]]; then
            echo "Custom domain CNAME detected, using base=/"
            echo "base=/" >> "$GITHUB_OUTPUT"
          elif [[ "$REPO" == "$OWNER.github.io" ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO/" >> "$GITHUB_OUTPUT"
          fi
          echo "Using base: ${{ steps.base.outputs.base }}"

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}
        run: npm run build:nocheck

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html not found. Build may have failed."
            exit 1
          fi
          echo "Build output verified:"
          ls -la dist/
          echo "---"
          ls -la dist/assets/ || echo "No assets directory found!"

      - name: Setup SPA fallback & ensure CNAME
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          # Ensure CNAME file is present in dist for custom domain
          if [[ -f "public/CNAME" ]]; then
            cp public/CNAME dist/CNAME
            echo "CNAME file copied to dist/"
          fi
          # Ensure _redirects file is present
          if [[ ! -f "dist/_redirects" ]]; then
            echo "/* /index.html 200" > dist/_redirects
            echo "_redirects file created in dist/"
          fi
          echo "Dist contents:"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
